plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yblocus.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yblocus.app'
        minSdk 26
        targetSdk 36
        versionCode 28
        versionName '2.8.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
