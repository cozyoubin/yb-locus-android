name: Build YB LOCUS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "YB_LOCUS_Android_v0.5_project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract YB LOCUS project
        run: |
          rm -rf project
          mkdir project
          unzip -q YB_LOCUS_Android_v0.5_project.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check JavaScript syntax
        working-directory: project
        run: |
          node --check app/src/main/assets/bridge.js
          node --check app/src/main/assets/investment_mobile.js

      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: project
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Create checksum
        working-directory: project
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YB-LOCUS-Android-v0.5
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30      - name: Check injected JavaScript syntax
        working-directory: project
        run: |
          node --check app/src/main/assets/bridge.js
          node --check app/src/main/assets/investment_mobile.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature and alignment
        working-directory: project
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Create SHA-256 checksum
        working-directory: project
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YB-LOCUS-Android-v0.5-debug
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
